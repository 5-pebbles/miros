name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # rustup installs the pinned toolchain from rust-toolchain.toml (rust-src included) on first use.
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Check version bump
        id: version
        if: github.event_name == 'push'
        run: |
          CURRENT=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          PREVIOUS=$(git show 'HEAD^:Cargo.toml' 2>/dev/null | grep -m1 '^version' | cut -d'"' -f2 || echo "0.0.0")
          if [ "$CURRENT" = "$PREVIOUS" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Version unchanged ($CURRENT), skipping release."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
          fi

      # Target x86-64-v2 (SSE4.2, POPCNT; Nehalem 2008+) instead of the runner's native CPU.
      - name: Build libmiros.so
        if: github.event_name == 'workflow_dispatch' || steps.version.outputs.changed == 'true'
        run: cargo xtask build --target-cpu x86-64-v2

      - name: Create GitHub release
        if: github.event_name == 'workflow_dispatch' || steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG already exists; bump the version in Cargo.toml or delete the release"
            exit 1
          fi
          gh release create "$TAG" \
            target/x86_64-unknown-linux-gnu/release/libmiros.so \
            --title "$TAG" \
            --generate-notes
