[workspace]
members = ["xtask"]

[package]
name = "miros"
version = "0.1.0"
edition = "2021"
description = "A modern ELF interpreter (dynamic linker/loader) written in Rust"
license = "MIT"
autobins = false

[lib]
crate-type = ["cdylib"]

[dependencies]
arbitrary-int = "2.0.0"
# std has no Atomic<T> for non-native primitives (the condvar's bitfield words).
atomic = "0.6.1"
bitbybit = "1.4.0"
bytemuck = { version = "1.25.2", features = ["derive"] }
indexmap = "2.13.0"

# We need a refrence to confirm our function signatures match, this method is from sunfishcode's c-ward.
libc = { version = "0.2.148", default-features = false }
# Pure-Rust fdlibm port (no FFI, no global init state), backs the exported libm surface.
libm = { version = "0.2", default-features = false, features = ["arch"] }
# Link-section distributed slices, registers interposable-data cells.
linkme = "0.3.37"
linux-raw-sys = { version = "0.11.0", features = ["net"] }
strum = { version = "0.27.2", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
# Set only by `cargo xtask build`, gates the generated alias include.
unexpected_cfgs = { level = "allow", check-cfg = ["cfg(miros_aliases)"] }
